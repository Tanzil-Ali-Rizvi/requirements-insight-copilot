# Copilot evaluation set. Each case states the route it must take and either the governed
# metric it must use or the document (and section) it must cite in its top-3 sources.
# Questions are written as stakeholders would ask them, not copied from the metric catalogue.

- {id: d01, q: "What share of our delivered orders arrive late?", route: data, metric: late_rate_overall}
- {id: d02, q: "How many orders were delivered after the promised date?", route: data, metric: late_rate_overall}
- {id: d03, q: "Show me the late delivery trend by month", route: data, metric: late_rate_by_month}
- {id: d04, q: "When during the year do late deliveries get worse?", route: data, metric: late_rate_by_month}
- {id: d05, q: "Which regions get the most late deliveries?", route: data, metric: late_rate_by_region}
- {id: d06, q: "Is the Northeast worse than the South for delays?", route: data, metric: late_rate_by_region}
- {id: d07, q: "Which states have the highest late rate?", route: data, metric: late_rate_by_state}
- {id: d08, q: "Is Maranhao or Bahia worse for late orders?", route: data, metric: late_rate_by_state}
- {id: d09, q: "How do late deliveries affect review scores?", route: data, metric: review_impact}
- {id: d10, q: "Do customers give fewer stars when the parcel is late?", route: data, metric: review_impact}
- {id: d11, q: "Do late seller handoffs cause late deliveries?", route: data, metric: seller_handoff}
- {id: d12, q: "What is the late rate when sellers ship after the shipping limit?", route: data, metric: seller_handoff}
- {id: d13, q: "Are interstate orders late more often?", route: data, metric: interstate}
