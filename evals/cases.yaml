- {id: d17, q: "How much revenue was in late orders?", route: data, metric: late_gmv}
- {id: d18, q: "What GMV is at risk from late delivery?", route: data, metric: late_gmv}
- {id: d19, q: "What share of late orders happened in peak months?", route: data, metric: peak_share}
- {id: d20, q: "How concentrated are late handoffs among sellers?", route: data, metric: seller_concentration}
- {id: d21, q: "Which sellers miss the shipping limit most often?", route: data, metric: top_late_sellers}
